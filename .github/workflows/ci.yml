name: Verify package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/prepare-host-sdk.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack
